[project]
name = "pystx"
version = "0.1.0"
description = "Python build system for Strategix/OneOffice"
authors = [
    {name = "Richard Moseley", email = "richard.moseley4@gmail.com"},
]
dependencies = ["meson>=1.7.0", "apsw>=3.48.0.0", "ninja>=1.11.1.3", "pcpp>=1.30", "python-magic>=0.4.27", "patchelf>=0.17.2.1"]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
